<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Merling </title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:linear-gradient(to bottom, #ffd6e7, #fff0f6);
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* Pantalla principal */

#inicio{
    text-align:center;
    padding:20px;
    z-index:10;
}

h1{
    color:#ff1493;
    font-size:2rem;
    margin-bottom:40px;
    text-shadow:0 2px 8px rgba(0,0,0,0.1);
}

/* Botones */

.botones{
    position:relative;
    width:300px;
    height:180px;
    margin:auto;
}

button{
    border:none;
    border-radius:14px;
    padding:14px 28px;
    font-size:20px;
    cursor:pointer;
    transition:0.2s;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

#si{
    background:#ff4fa3;
    color:white;
    position:relative;
    z-index:5;
}

#si:active{
    transform:scale(0.95);
}

#no{
    background:white;
    color:#444;
    position:absolute;
    left:180px;
    top:0;
    z-index:6;
}

/* Pantalla flores */

#escenaFlores{
    position:absolute;
    inset:0;
    overflow:hidden;
    display:none;
    background:linear-gradient(to top, #fff0f7, #ffe3ef);
}

/* Texto final */

#mensajeFinal{
    position:absolute;
    top:8%;
    width:100%;
    text-align:center;
    font-size:2rem;
    font-weight:bold;
    color:#ff1493;
    z-index:50;
    padding:20px;
    text-shadow:0 2px 10px rgba(255,255,255,0.8);
}

/* Flores */

.flor{
    position:absolute;
    bottom:-150px;
    width:80px;
    height:80px;
    transform-origin:center bottom;
    animation:subir 4s ease forwards;
}

/* Tallo */

.tallo{
    position:absolute;
    width:8px;
    height:0;
    background:#2e8b57;
    left:50%;
    transform:translateX(-50%);
    bottom:0;
    border-radius:20px;
    animation:crecerTallo 1.2s ease forwards;
}

/* Centro flor */

.centro{
    position:absolute;
    width:24px;
    height:24px;
    background:#ffd700;
    border-radius:50%;
    left:50%;
    top:8px;
    transform:translateX(-50%) scale(0);
    z-index:5;
    animation:aparecerCentro 0.5s ease forwards;
    animation-delay:1.1s;
}

/* Petalos */

.petalo{
    position:absolute;
    width:26px;
    height:40px;
    background:pink;
    border-radius:50%;
    left:50%;
    top:0;
    transform-origin:center 50px;
    opacity:0;
    animation:abrirPetalos 0.7s ease forwards;
    animation-delay:1.3s;
}

/* Animaciones */

@keyframes crecerTallo{
    from{
        height:0;
    }

    to{
        height:130px;
    }
}

@keyframes abrirPetalos{
    from{
        opacity:0;
        transform:translateX(-50%) scale(0);
    }

    to{
        opacity:1;
    }
}

@keyframes aparecerCentro{
    from{
        transform:translateX(-50%) scale(0);
    }

    to{
        transform:translateX(-50%) scale(1);
    }
}

@keyframes subir{
    from{
        transform:translateY(120px);
        opacity:0;
    }

    to{
        transform:translateY(0);
        opacity:1;
    }
}

/* Corazones flotando */

.corazon{
    position:absolute;
    font-size:24px;
    animation:flotar 6s linear infinite;
    opacity:0.7;
}

@keyframes flotar{
    from{
        transform:translateY(100vh) scale(0.5);
        opacity:0;
    }

    20%{
        opacity:0.8;
    }

    to{
        transform:translateY(-120px) scale(1.2);
        opacity:0;
    }
}

</style>
</head>

<body>

<div id="inicio">

    <h1>¿Merling es juega de viva? 😌</h1>

    <div class="botones">
        <button id="si">Sí</button>
        <button id="no">No</button>
    </div>

</div>

<div id="escenaFlores">

    <div id="mensajeFinal">
        Flores para la más juega de viva 🌸
    </div>

</div>

<script>

const botonNo = document.getElementById("no");
const botonSi = document.getElementById("si");

const inicio = document.getElementById("inicio");
const escenaFlores = document.getElementById("escenaFlores");

/* =========================
   BOTON NO PARA TELEFONO
========================= */

function moverBoton(){

    const margen = 20;

    const maxX = window.innerWidth - botonNo.offsetWidth - margen;
    const maxY = window.innerHeight - botonNo.offsetHeight - margen;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    botonNo.style.left = x + "px";
    botonNo.style.top = y + "px";
}

/* Desktop */

botonNo.addEventListener("mouseenter", moverBoton);

/* Telefono */

botonNo.addEventListener("touchstart", function(e){

    e.preventDefault();
    moverBoton();

});

/* =========================
   CLICK EN SI
========================= */

botonSi.addEventListener("click", () => {

    inicio.style.display = "none";
    escenaFlores.style.display = "block";

    crearFlores();
    crearCorazones();

});

/* =========================
   CREAR FLORES
========================= */

function crearFlores(){

    for(let i = 0; i < 18; i++){

        const flor = document.createElement("div");
        flor.classList.add("flor");

        flor.style.left =
            Math.random() * 90 + "%";

        flor.style.animationDelay =
            Math.random() * 1.5 + "s";

        /* Tallo */

        const tallo = document.createElement("div");
        tallo.classList.add("tallo");

        /* Centro */

        const centro = document.createElement("div");
        centro.classList.add("centro");

        /* Petalos */

        for(let p = 0; p < 8; p++){

            const petalo =
                document.createElement("div");

            petalo.classList.add("petalo");

            petalo.style.transform =
                `translateX(-50%) rotate(${p*45}deg)`;

            petalo.style.background =
                `hsl(${Math.random()*360}, 85%, 75%)`;

            flor.appendChild(petalo);
        }

        flor.appendChild(tallo);
        flor.appendChild(centro);

        escenaFlores.appendChild(flor);
    }
}

/* =========================
   CORAZONES
========================= */

function crearCorazones(){

    setInterval(() => {

        const corazon =
            document.createElement("div");

        corazon.classList.add("corazon");

        corazon.innerHTML = "💖";

        corazon.style.left =
            Math.random() * 100 + "%";

        corazon.style.animationDuration =
            (4 + Math.random()*3) + "s";

        corazon.style.fontSize =
            (20 + Math.random()*25) + "px";

        escenaFlores.appendChild(corazon);

        setTimeout(() => {
            corazon.remove();
        }, 7000);

    }, 500);
}

</script>

</body>
</html>
