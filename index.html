<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Merling 🌸</title>

<style>

/* =========================
   ESTILO GENERAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    background:#000;
    font-family:Arial, sans-serif;
    position:relative;
}

/* =========================
   PREGUNTA
========================= */

#pregunta{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:100;
    background:linear-gradient(to bottom,#0d0d0d,#1a0011);
}

#pregunta h1{
    color:white;
    font-size:2rem;
    text-align:center;
    margin-bottom:40px;
    padding:20px;
}

.botones{
    position:relative;
    width:320px;
    height:220px;
}

button{
    padding:14px 28px;
    border:none;
    border-radius:14px;
    font-size:20px;
    cursor:pointer;
    transition:0.2s;
    position:absolute;
}

#si{
    left:40px;
    top:70px;
    background:#ff1493;
    color:white;
    box-shadow:0 0 20px #ff1493;
}

#si:active{
    transform:scale(0.95);
}

#no{
    left:180px;
    top:70px;
    background:white;
    color:black;
}

/* =========================
   ESCENA FLORES
========================= */

#escena{
    position:absolute;
    inset:0;
    display:none;
    overflow:hidden;
    background:radial-gradient(circle at bottom,#1a0015,#000);
}

/* =========================
   TEXTO FINAL
========================= */

#mensaje{
    position:absolute;
    top:7%;
    width:100%;
    text-align:center;
    color:#ff69b4;
    font-size:2rem;
    font-weight:bold;
    z-index:200;
    text-shadow:0 0 20px #ff1493;
    padding:20px;
    opacity:0;
    animation:aparecerTexto 3s forwards;
    animation-delay:2s;
}

@keyframes aparecerTexto{
    to{
        opacity:1;
    }
}

/* =========================
   FLORES
========================= */

.flor{
    position:absolute;
    bottom:-300px;
    width:120px;
    height:300px;
    animation:subirFlor 4s ease forwards;
}

/* Tallo */

.tallo{
    position:absolute;
    width:8px;
    height:0;
    background:linear-gradient(to top,#145a32,#2ecc71);
    left:50%;
    transform:translateX(-50%);
    bottom:0;
    border-radius:20px;
    animation:crecerTallo 2s forwards;
}

/* Centro */

.centro{
    position:absolute;
    width:26px;
    height:26px;
    background:#ffd700;
    border-radius:50%;
    left:50%;
    top:42px;
    transform:translateX(-50%) scale(0);
    z-index:5;
    box-shadow:0 0 20px #ffd700;
    animation:mostrarCentro 0.7s forwards;
    animation-delay:1.8s;
}

/* Petalos */

.petalo{
    position:absolute;
    width:34px;
    height:60px;
    border-radius:50%;
    left:50%;
    top:20px;
    transform-origin:center 70px;
    opacity:0;
    filter:drop-shadow(0 0 10px pink);
    animation:abrirPetalos 1s forwards;
    animation-delay:2s;
}

/* Hojas */

.hoja{
    position:absolute;
    width:26px;
    height:50px;
    background:#2ecc71;
    border-radius:50%;
    bottom:80px;
}

/* Animaciones */

@keyframes crecerTallo{
    from{
        height:0;
    }

    to{
        height:220px;
    }
}

@keyframes mostrarCentro{
    to{
        transform:translateX(-50%) scale(1);
    }
}

@keyframes abrirPetalos{
    from{
        opacity:0;
        transform:translateX(-50%) scale(0);
    }

    to{
        opacity:1;
    }
}

@keyframes subirFlor{
    from{
        transform:translateY(200px);
        opacity:0;
    }

    to{
        transform:translateY(0);
        opacity:1;
    }
}

/* =========================
   PARTICULAS
========================= */

.particula{
    position:absolute;
    border-radius:50%;
    background:white;
    opacity:0.7;
    animation:flotar linear infinite;
}

@keyframes flotar{
    from{
        transform:translateY(100vh);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    to{
        transform:translateY(-120px);
        opacity:0;
    }
}

</style>
</head>

<body>

<!-- ======================
     PREGUNTA
======================= -->

<div id="pregunta">

    <h1>
        ¿Merling es juega de viva? 😌
    </h1>

    <div class="botones">

        <button id="si">
            Sí
        </button>

        <button id="no">
            No
        </button>

    </div>

</div>

<!-- ======================
     ESCENA FLORES
======================= -->

<div id="escena">

    <div id="mensaje">
        Flores para la más juega de viva 🌸
    </div>

</div>

<script>

/* =========================
   BOTON NO
========================= */

const botonNo =
    document.getElementById("no");

function moverBoton(){

    const margen = 20;

    const maxX =
        window.innerWidth
        - botonNo.offsetWidth
        - margen;

    const maxY =
        window.innerHeight
        - botonNo.offsetHeight
        - margen;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    botonNo.style.left = x + "px";
    botonNo.style.top = y + "px";
}

/* PC */

botonNo.addEventListener(
    "mouseenter",
    moverBoton
);

/* TELEFONO */

botonNo.addEventListener(
    "touchstart",
    (e)=>{

        e.preventDefault();
        moverBoton();

    }
);

/* =========================
   CLICK SI
========================= */

document.getElementById("si")
.addEventListener("click", ()=>{

    document.getElementById("pregunta")
    .style.display = "none";

    document.getElementById("escena")
    .style.display = "block";

    crearFlores();
    crearParticulas();

});

/* =========================
   CREAR FLORES
========================= */

function crearFlores(){

    for(let i=0;i<14;i++){

        const flor =
            document.createElement("div");

        flor.classList.add("flor");

        flor.style.left =
            (Math.random()*90) + "%";

        flor.style.animationDelay =
            (Math.random()*2) + "s";

        /* TALLO */

        const tallo =
            document.createElement("div");

        tallo.classList.add("tallo");

        /* CENTRO */

        const centro =
            document.createElement("div");

        centro.classList.add("centro");

        /* HOJAS */

        const hoja1 =
            document.createElement("div");

        hoja1.classList.add("hoja");

        hoja1.style.left = "40px";
        hoja1.style.transform =
            "rotate(-35deg)";

        const hoja2 =
            document.createElement("div");

        hoja2.classList.add("hoja");

        hoja2.style.left = "55px";
        hoja2.style.transform =
            "rotate(35deg)";

        /* PETALOS */

        for(let p=0;p<10;p++){

            const petalo =
                document.createElement("div");

            petalo.classList.add("petalo");

            petalo.style.transform =
                `translateX(-50%) rotate(${p*36}deg)`;

            petalo.style.background =
                `hsl(${Math.random()*360},
                90%,75%)`;

            flor.appendChild(petalo);
        }

        flor.appendChild(tallo);
        flor.appendChild(centro);
        flor.appendChild(hoja1);
        flor.appendChild(hoja2);

        document.getElementById("escena")
        .appendChild(flor);
    }
}

/* =========================
   PARTICULAS
========================= */

function crearParticulas(){

    setInterval(()=>{

        const p =
            document.createElement("div");

        p.classList.add("particula");

        const size =
            Math.random()*6 + 2;

        p.style.width =
            size + "px";

        p.style.height =
            size + "px";

        p.style.left =
            Math.random()*100 + "%";

        p.style.animationDuration =
            (4 + Math.random()*5) + "s";

        document.getElementById("escena")
        .appendChild(p);

        setTimeout(()=>{
            p.remove();
        },10000);

    },120);
}

</script>

</body>
</html>
