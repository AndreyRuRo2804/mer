<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merling 🌸</title>

<style>

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ffe6f0;
    font-family:Arial, sans-serif;
}

#contenedor{
    text-align:center;
}

h1{
    color:#ff1493;
    font-size:2rem;
}

.botones{
    margin-top:20px;
    position:relative;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    margin:10px;
    transition:0.2s;
}

#si{
    background:#ff69b4;
    color:white;
}

#no{
    background:#ddd;
    position:absolute;
}

#flores{
    display:none;
    position:absolute;
    inset:0;
    background:white;
}

.mensaje{
    position:absolute;
    top:15%;
    width:100%;
    text-align:center;
    font-size:2rem;
    color:#ff1493;
    font-weight:bold;
}

.flor{
    position:absolute;
    bottom:-100px;
    width:60px;
    height:60px;
    background:pink;
    border-radius:50%;
    animation:crecer 3s forwards;
}

@keyframes crecer{
    0%{
        transform:translateY(100px) scale(0);
        opacity:0;
    }

    100%{
        transform:translateY(0px) scale(1);
        opacity:1;
    }
}

</style>
</head>

<body>

<div id="contenedor">

    <h1>¿Merling es juega de viva? 😌</h1>

    <div class="botones">
        <button id="si">Sí</button>
        <button id="no">No</button>
    </div>

</div>

<div id="flores">

    <div class="mensaje">
        Flores para la más juega de viva 🌸
    </div>

</div>

<script>

const botonNo = document.getElementById("no");
const botonSi = document.getElementById("si");
const flores = document.getElementById("flores");
const contenedor = document.getElementById("contenedor");

botonNo.addEventListener("mouseover", () => {

    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 100);

    botonNo.style.left = `${x}px`;
    botonNo.style.top = `${y}px`;

});

botonSi.addEventListener("click", () => {

    contenedor.style.display = "none";
    flores.style.display = "block";

    for(let i=0; i<25; i++){

        const flor = document.createElement("div");
        flor.classList.add("flor");

        flor.style.left = Math.random() * 100 + "%";
        flor.style.background =
            `hsl(${Math.random()*360}, 80%, 75%)`;

        flor.style.animationDelay =
            Math.random() * 2 + "s";

        flores.appendChild(flor);
    }

});

</script>

</body>
</html>
