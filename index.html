<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Merling 🌸</title>
    <style>
        /* =========================
           ESTILO GENERAL
        ========================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* =========================
           PANTALLA DE PREGUNTA
        ========================= */
        #pregunta {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            transition: opacity 1s ease;
        }

        #pregunta h1 {
            color: #fff;
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 50px;
            text-shadow: 0 0 15px rgba(255, 20, 147, 0.5);
        }

        .botones {
            position: relative;
            width: 300px;
            height: 150px;
        }

        button {
            padding: 15px 35px;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            position: absolute;
        }

        #si {
            left: 20px;
            background: #ff1493;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 20, 147, 0.4);
        }

        #si:hover { transform: scale(1.1); background: #ff69b4; }

        #no {
            right: 20px;
            background: #444;
            color: #ccc;
        }

        /* =========================
           ESCENA DE FLORES
        ========================= */
        #escena {
            position: absolute;
            inset: 0;
            display: none;
            background: linear-gradient(to bottom, #000000, #2d0a1e);
            overflow: hidden;
        }

        #mensaje {
            position: absolute;
            top: 10%;
            width: 100%;
            text-align: center;
            color: #ffb6c1;
            font-size: 2.5rem;
            font-weight: bold;
            z-index: 200;
            text-shadow: 0 0 20px #ff1493;
            opacity: 0;
            animation: fadeIn 2s forwards 1s;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        /* Estilo del Contenedor de la Flor SVG */
        .flower-container {
            position: absolute;
            bottom: -50px;
            transform-origin: bottom center;
            animation: growFlower 4s ease-out forwards;
        }

        @keyframes growFlower {
            0% { transform: scale(0) translateY(100px); }
            100% { transform: scale(1) translateY(0); }
        }

        /* =========================
           PARTÍCULAS MÁGICAS
        ========================= */
        .sparkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            animation: fly 5s linear infinite;
        }

        @keyframes fly {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

<div id="pregunta">
    <h1>¿Merling es juega de viva? 😌</h1>
    <div class="botones">
        <button id="si">Sí</button>
        <button id="no">No</button>
    </div>
</div>

<div id="escena">
    <div id="mensaje">Flores para la más juega de viva 🌸</div>
</div>

<script>
    const btnSi = document.getElementById('si');
    const btnNo = document.getElementById('no');
    const escena = document.getElementById('escena');
    const pregunta = document.getElementById('pregunta');

    /* --- LÓGICA BOTÓN NO (Huir) --- */
    function moverBoton() {
        const x = Math.random() * (window.innerWidth - btnNo.offsetWidth - 40);
        const y = Math.random() * (window.innerHeight - btnNo.offsetHeight - 40);
        btnNo.style.left = `${x}px`;
        btnNo.style.top = `${y}px`;
    }

    btnNo.addEventListener('mouseenter', moverBoton);
    btnNo.addEventListener('touchstart', (e) => { e.preventDefault(); moverBoton(); });

    /* --- ACCIÓN BOTÓN SÍ --- */
    btnSi.addEventListener('click', () => {
        pregunta.style.opacity = '0';
        setTimeout(() => {
            pregunta.style.display = 'none';
            escena.style.display = 'block';
            iniciarEfecto();
        }, 1000);
    });

    function iniciarEfecto() {
        for (let i = 0; i < 12; i++) {
            setTimeout(crearFlorRealista, i * 400);
        }
        crearLluviaMagica();
    }

    /* --- GENERADOR DE FLORES SVG --- */
    function crearFlorRealista() {
        const contenedor = document.createElement('div');
        contenedor.classList.add('flower-container');
        
        const size = Math.random() * 150 + 200; // Tamaño aleatorio
        const posX = Math.random() * 90; // Posición aleatoria
        
        contenedor.style.left = `${posX}%`;
        contenedor.style.width = `${size}px`;
        contenedor.style.height = `${size * 1.5}px`;

        // Colores aleatorios para los pétalos (tonos rosas y púrpuras)
        const hue = Math.floor(Math.random() * 40) + 320; 
        
        // Estructura SVG de la flor
        contenedor.innerHTML = `
            <svg viewBox="0 0 200 400" width="100%" height="100%">
                <!-- Tallo -->
                <path d="M100,400 Q110,300 100,150" stroke="#2d5a27" stroke-width="6" fill="none" />
                
                <!-- Hojas -->
                <ellipse cx="85" cy="300" rx="10" ry="25" fill="#3a7d34" transform="rotate(-30 85 300)" />
                <ellipse cx="115" cy="260" rx="10" ry="25" fill="#3a7d34" transform="rotate(30 115 260)" />

                <!-- Pétalos (Generados dinámicamente) -->
                <g transform="translate(100, 150)">
                    ${generarPetalosSVG(hue)}
                    <!-- Centro de la flor -->
                    <circle cx="0" cy="0" r="15" fill="url(#centroGradiente)" />
                </g>

                <defs>
                    <radialGradient id="centroGradiente">
                        <stop offset="10%" stop-color="#ffeb3b" />
                        <stop offset="90%" stop-color="#fbc02d" />
                    </radialGradient>
                </defs>
            </svg>
        `;

        escena.appendChild(contenedor);
    }

    function generarPetalosSVG(hue) {
        let petalosHTML = '';
        for (let i = 0; i < 8; i++) {
            const rotacion = i * 45;
            petalosHTML += `
                <path d="M0,0 Q-30,-60 0,-90 Q30,-60 0,0" 
                      fill="hsl(${hue}, 80%, 70%)" 
                      fill-opacity="0.8"
                      stroke="hsl(${hue}, 80%, 40%)"
                      stroke-width="1"
                      transform="rotate(${rotacion})" />
            `;
        }
        return petalosHTML;
    }

    /* --- PARTICULAS DE FONDO --- */
    function crearLluviaMagica() {
        setInterval(() => {
            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            const size = Math.random() * 4 + 2;
            sparkle.style.width = `${size}px`;
            sparkle.style.height = `${size}px`;
            sparkle.style.left = `${Math.random() * 100}%`;
            sparkle.style.boxShadow = `0 0 10px white`;
            sparkle.style.animationDuration = `${Math.random() * 3 + 2}s`;
            
            escena.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 5000);
        }, 150);
    }
</script>

</body>
</html>
